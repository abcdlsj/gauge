<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>Gauge</title>
<link rel="icon" href="/mark.svg" type="image/svg+xml" />
<script>
(function () {
  var stored = localStorage.getItem('gauge-theme') || 'auto';
  var forced = new URLSearchParams(location.search).get('theme');
  var theme = ['auto', 'light', 'dark'].includes(forced) ? forced : stored;
  if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
})();
</script>
<link rel="stylesheet" href="/app.css" />
</head>
<body>
<div class="shell">
  <header class="top">
    <a class="brand" href="#/overview">
      <img class="mark" src="/mark.svg" width="22" height="22" alt="" />
      <span class="brand-name">Gauge</span>
    </a>

    <nav class="nav" id="nav" aria-label="Sections">
      <a href="#/overview" data-view="usage">Overview</a>
      <a href="#/activity" data-view="activity">Activity</a>
      <a href="/settings.html" data-view="settings">Settings</a>
    </nav>

    <div class="actions">
      <span class="sync" id="sync">syncing…</span>
      <button class="btn icon" id="refresh-all" type="button" title="Refresh all" aria-label="Refresh all">
        <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true">
          <path fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" d="M16.2 8.4A6.4 6.4 0 1 0 16 12.6M16.2 3.6v4.8h-4.8"/>
        </svg>
      </button>
      <button class="btn icon" id="theme" type="button" title="Theme" aria-label="Toggle theme"></button>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <main id="view-usage">
    <div class="skeleton-note">Reading local snapshot…</div>
  </main>

  <section id="view-source" hidden></section>

  <section id="view-activity" hidden>
    <div class="act-sec">
      <div class="eyebrow-bar">
        <span class="eyebrow">Collectors</span>
        <span class="eyebrow-meta">cadence · last run · next run</span>
      </div>
      <div class="panel">
        <div class="runs" id="runs"></div>
      </div>
    </div>

    <div class="act-sec">
      <div class="eyebrow-bar">
        <span class="eyebrow">Activity</span>
        <span class="eyebrow-meta">state changes only</span>
      </div>
      <div class="panel">
        <ul class="log" id="log"></ul>
      </div>
    </div>
  </section>

  <footer>
    <span>Gauge · local SQLite snapshots</span>
    <span id="footer-meta"></span>
  </footer>
</div>

<div class="toast" id="toast" hidden></div>
<script src="/app.js"></script>
</body>
</html>

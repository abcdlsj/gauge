<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>Gauge</title>
<link rel="icon" href="/mark.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/app.css" />
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand">
      <img class="mark" src="/mark.svg" alt="" />
      <div class="brand-text">
        <h1>Gauge</h1>
        <p>quota &amp; billing</p>
      </div>
    </div>

    <nav class="nav" id="nav" aria-label="Sections">
      <a href="#/usage" data-view="usage">Usage</a>
      <a href="#/activity" data-view="activity">Activity</a>
    </nav>

    <div class="actions">
      <div class="accounts" id="accounts"></div>
      <span class="sync" id="sync">loading…</span>
      <button class="btn icon" id="theme" title="Theme" aria-label="Toggle theme">
        <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M10 3.5a6.5 6.5 0 1 0 6.5 6.5A5.2 5.2 0 0 1 10 3.5Z" fill="currentColor"/></svg>
      </button>
      <button class="btn icon" id="refresh-all" title="Refresh all" aria-label="Refresh all">
        <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
          <path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" d="M16.2 8.4A6.4 6.4 0 1 0 16 12.6M16.2 3.6v4.8h-4.8"/>
        </svg>
      </button>
      <a class="btn icon" id="settings-link" href="/settings.html" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
          <path fill="currentColor" d="M10 6.9A3.1 3.1 0 1 0 10 13.1 3.1 3.1 0 0 0 10 6.9Zm7 3.1c0-.4 0-.7-.1-1l1.4-1.1-1.5-2.6-1.7.6a7 7 0 0 0-1.7-1L13.1 3H9.9l-.3 1.9a7 7 0 0 0-1.7 1l-1.7-.6-1.5 2.6L6.1 9a7.6 7.6 0 0 0 0 2L4.7 12.1l1.5 2.6 1.7-.6c.5.4 1.1.8 1.7 1l.3 1.9h3.2l.3-1.9c.6-.2 1.2-.6 1.7-1l1.7.6 1.5-2.6-1.4-1.1c.1-.3.1-.6.1-1Z"/>
        </svg>
      </a>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <nav class="rail" id="rail" aria-label="Jump to collector" hidden></nav>

  <main id="view-usage">
    <div class="skeleton-note">Reading local snapshot…</div>
  </main>

  <section id="view-activity" hidden>
    <div class="panel">
      <div class="panel-head">
        <h2>Collectors</h2>
        <span class="hint">cadence · last run · next run</span>
      </div>
      <div class="runs" id="runs"></div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>Activity</h2>
        <span class="hint">state changes only</span>
      </div>
      <ul class="log" id="log"></ul>
    </div>
  </section>

  <footer>
    <span>Read-only panel · one binary · SQLite snapshots</span>
    <span id="footer-meta"></span>
  </footer>
</div>

<div class="toast" id="toast" hidden></div>
<script src="/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>Gauge · Settings</title>
<link rel="icon" href="/mark.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/app.css" />
<link rel="stylesheet" href="/settings-ui.css" />
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand">
      <img class="mark" src="/mark.svg" alt="" />
      <div class="brand-text">
        <h1>Gauge</h1>
        <p>Credentials &amp; settings</p>
      </div>
    </div>

    <nav class="nav" aria-label="Sections">
      <a href="/#/overview">Overview</a>
      <a href="/#/activity">Activity</a>
      <a href="/settings.html" aria-current="page">Settings</a>
    </nav>

    <div class="actions">
      <a class="btn icon" id="settings-link" href="/#/overview" title="Back to panel" aria-label="Back to panel">
        <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
          <path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M11.5 5.5 7 10l4.5 4.5"/>
        </svg>
      </a>
      <button class="btn icon" id="theme" title="Theme" aria-label="Toggle theme">
        <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M10 3.5a6.5 6.5 0 1 0 6.5 6.5A5.2 5.2 0 0 1 10 3.5Z" fill="currentColor"/></svg>
      </button>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <main id="settings-root" class="settings-page"></main>

  <footer>
    <span>Read-only panel · one binary · SQLite snapshots</span>
    <span>changes save as you go · secrets are encrypted at rest</span>
  </footer>
</div>

<div class="toast" id="toast" hidden></div>
<script src="/settings-ui.js"></script>
<script src="/settings.js"></script>
</body>
</html>

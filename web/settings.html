<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>Gauge · Settings</title>
<link rel="icon" href="/mark.svg" type="image/svg+xml" />
<script>
(function () {
  var stored = localStorage.getItem('gauge-theme') || 'auto';
  var forced = new URLSearchParams(location.search).get('theme');
  var theme = ['auto', 'light', 'dark'].includes(forced) ? forced : stored;
  if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
})();
</script>
<link rel="stylesheet" href="/app.css" />
<link rel="stylesheet" href="/settings-ui.css" />
</head>
<body>
<div class="shell">
  <header class="top">
    <a class="brand" href="/#/overview">
      <img class="mark" src="/mark.svg" width="22" height="22" alt="" />
      <span class="brand-name">Gauge</span>
    </a>

    <nav class="nav" aria-label="Sections">
      <a href="/#/overview">Overview</a>
      <a href="/#/activity">Activity</a>
      <a href="/settings.html" aria-current="page">Settings</a>
    </nav>

    <div class="actions">
      <span class="sync">auto-saved</span>
      <button class="btn icon" id="theme" type="button" title="Theme" aria-label="Toggle theme"></button>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <main id="settings-root" class="settings-page"></main>

  <footer>
    <span>Gauge · local SQLite snapshots</span>
    <span>changes save as you go · secrets encrypted at rest</span>
  </footer>
</div>

<div class="toast" id="toast" hidden></div>
<script src="/settings-ui.js"></script>
<script src="/settings.js"></script>
</body>
</html>

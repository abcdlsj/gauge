name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      # The desktop shell needs cgo plus GTK/WebKit on Linux, which the ubuntu
      # image has no headers for. The purego tag types-checks it everywhere;
      # the app job below is what actually builds the Wails binary with cgo.
      - run: go vet -tags purego ./...
      - run: go test -tags purego ./...

  # The desktop app is macOS-only (menu bar popover, template icons, Chrome
  # cookie decryption through the macOS keychain). The headless server is pure
  # Go and has to keep building everywhere.
  app:
    name: macos app bundle
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make dist
      - name: check the bundle
        run: |
          lipo -archs build/bin/Gauge.app/Contents/MacOS/Gauge | grep -q arm64
          lipo -archs build/bin/Gauge.app/Contents/MacOS/Gauge | grep -q x86_64
          codesign --verify --deep --strict build/bin/Gauge.app
          unzip -l build/dist/Gauge-*-macos-universal.zip | grep -q "Gauge.app/Contents/MacOS/Gauge"
          hdiutil attach -nobrowse -readonly build/dist/Gauge-*-macos-universal.dmg
          ls /Volumes/Gauge*/Gauge.app/Contents/MacOS/Gauge
          test -L /Volumes/Gauge*/Applications
          hdiutil detach -quiet /Volumes/Gauge*
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: build/dist/Gauge-*-macos-universal.*
          if-no-files-found: error

  server:
    name: headless builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make server-dist
      - uses: actions/upload-artifact@v4
        with:
          name: headless
          path: build/dist/gauge-*
          if-no-files-found: error

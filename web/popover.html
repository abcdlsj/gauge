<!DOCTYPE html>
<html lang="en" data-shell="popover">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>Gauge</title>
<script>
// Read the theme before the stylesheets paint, so the popover never flashes the
// wrong palette. popover.js owns the rest of the cycle.
(function () {
  var stored = localStorage.getItem('gauge-theme') || 'auto';
  var forced = new URLSearchParams(location.search).get('theme');
  var theme = ['auto', 'light', 'dark'].includes(forced) ? forced : stored;
  if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
})();
</script>
<link rel="stylesheet" href="/app.css" />
<link rel="stylesheet" href="/popover.css" />
<link rel="stylesheet" href="/settings-ui.css" />
</head>
<body>
<div class="panel">
<header class="pop-head">
  <div class="pop-brand">
    <img class="pop-mark" src="/mark.svg" width="22" height="22" alt="" />
    <span>Gauge</span>
  </div>
  <div class="pop-actions">
    <button class="pop-btn" id="theme" title="Theme: Follow system" aria-label="Theme: Follow system"></button>
    <button class="pop-btn" id="refresh-all" title="Refresh" aria-label="Refresh">
      <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true">
        <path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" d="M16.2 8.4A6.4 6.4 0 1 0 16 12.6M16.2 3.6v4.8h-4.8" />
      </svg>
    </button>
    <button class="pop-btn" id="open-settings" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true">
        <path fill="currentColor" d="M10 6.9A3.1 3.1 0 1 0 10 13.1 3.1 3.1 0 0 0 10 6.9Zm7 3.1c0-.4 0-.7-.1-1l1.4-1.1-1.5-2.6-1.7.6a7 7 0 0 0-1.7-1L13.1 3H9.9l-.3 1.9a7 7 0 0 0-1.7 1l-1.7-.6-1.5 2.6L6.1 9a7.6 7.6 0 0 0 0 2L4.7 12.1l1.5 2.6 1.7-.6c.5.4 1.1.8 1.7 1l.3 1.9h3.2l.3-1.9c.6-.2 1.2-.6 1.7-1l1.7.6 1.5-2.6-1.4-1.1c.1-.3.1-.6.1-1Z"/>
      </svg>
    </button>
  </div>
</header>

<div class="scroll-wrap" id="list-scroll">
  <main class="pop-body scroll-area" id="pop-body"></main>
</div>

<section class="set-view" id="view-settings" hidden>
  <header class="set-head">
    <button class="pop-btn set-back" id="close-settings" type="button" title="Back" aria-label="Back">
      <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
        <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 5 7 10l5 5" />
      </svg>
    </button>
    <div class="set-heading">
      <button class="set-eyebrow" id="settings-eyebrow" type="button" hidden></button>
      <span class="set-title" id="settings-title">Settings</span>
    </div>
    <div class="set-actions">
      <button class="pop-btn" id="settings-theme" type="button" title="Theme" aria-label="Theme"></button>
      <button class="pop-btn" id="settings-refresh" type="button" title="Refresh source" aria-label="Refresh source" hidden>
        <svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true">
          <path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" d="M16.2 8.4A6.4 6.4 0 1 0 16 12.6M16.2 3.6v4.8h-4.8" />
        </svg>
      </button>
      <button class="pop-btn" id="settings-home" type="button" title="Close settings" aria-label="Close settings" hidden>
        <svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true">
          <path fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" d="M5.5 5.5l9 9M14.5 5.5l-9 9" />
        </svg>
      </button>
    </div>
  </header>
  <div class="scroll-wrap" id="settings-scroll">
    <div id="settings-root" class="set-body scroll-area"></div>
  </div>
</section>

<footer class="pop-foot">
  <span id="sync">syncing…</span>
  <span class="pop-foot-note" id="foot-note">auto-saved</span>
</footer>

<div class="toast" id="toast" hidden></div>
</div>
<script src="/settings-ui.js"></script>
<script src="/popover.js"></script>
</body>
</html>

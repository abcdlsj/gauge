name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  check:
    name: version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: tag, Info.plist and wails.json must agree
        run: make version-check

  app:
    name: macos app bundle
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: svg rasteriser for scripts/make_icons.py
        run: brew install librsvg
      - run: make dist
      - name: check the bundle
        run: |
          lipo -archs build/bin/Gauge.app/Contents/MacOS/Gauge | grep -q arm64
          lipo -archs build/bin/Gauge.app/Contents/MacOS/Gauge | grep -q x86_64
          codesign --verify --deep --strict build/bin/Gauge.app
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: build/dist/Gauge-*-macos-universal.zip
          if-no-files-found: error

  server:
    name: headless builds
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make server-dist
      - uses: actions/upload-artifact@v4
        with:
          name: headless
          path: build/dist/gauge-*
          if-no-files-found: error

  publish:
    name: publish ${{ github.ref_name }}
    needs: [app, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "Gauge $version" \
              --generate-notes \
              --verify-tag
          fi
